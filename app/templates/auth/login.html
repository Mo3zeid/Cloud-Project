{% extends "base.html" %}
{% block title %}Sign In — Research Cloud Portal{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card glass-card">
        <div class="auth-header">
            <span class="auth-logo">☁️</span>
            <h1>Welcome Back</h1>
            <p class="auth-subtitle">Sign in to your Research Cloud account</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form" id="login-form">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <div class="input-wrapper">
                    <span class="input-icon">👤</span>
                    <input type="text" id="username" name="username" class="form-input"
                           placeholder="Enter your username" required autocomplete="username" autofocus>
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="password" name="password" class="form-input"
                           placeholder="Enter your password" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-full" id="login-submit">
                <span class="btn-text">Sign In</span>
                <span class="btn-icon">→</span>
            </button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a href="{{ url_for('auth.register') }}" class="auth-link" id="register-link">Create one</a></p>
        </div>
    </div>
</div>
{% endblock %}
