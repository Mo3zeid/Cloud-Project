{% extends "base.html" %}
{% block title %}Create Account — Research Cloud Portal{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card glass-card">
        <div class="auth-header">
            <span class="auth-logo">🚀</span>
            <h1>Create Account</h1>
            <p class="auth-subtitle">Join the Research Cloud and start computing</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}" class="auth-form" id="register-form">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <div class="input-wrapper">
                    <span class="input-icon">👤</span>
                    <input type="text" id="username" name="username" class="form-input"
                           placeholder="Choose a username" required minlength="3" autofocus>
                </div>
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Email</label>
                <div class="input-wrapper">
                    <span class="input-icon">📧</span>
                    <input type="email" id="email" name="email" class="form-input"
                           placeholder="your.email@university.edu" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="password" name="password" class="form-input"
                           placeholder="Minimum 6 characters" required minlength="6">
                </div>
            </div>

            <div class="form-group">
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-input"
                           placeholder="Re-enter your password" required minlength="6">
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-full" id="register-submit">
                <span class="btn-text">Create Account</span>
                <span class="btn-icon">🚀</span>
            </button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="{{ url_for('auth.login') }}" class="auth-link" id="login-link">Sign in</a></p>
        </div>
    </div>
</div>
{% endblock %}
